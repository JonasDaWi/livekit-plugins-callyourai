[project]
name = "livekit-plugins-callyourai"
version = "0.1.0"
description = "callyourai avatars for LiveKit Agents: give your voice agent a face"
requires-python = ">=3.10"
dependencies = ["livekit-agents>=1.2", "httpx>=0.27"]
readme = "README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["livekit"]
